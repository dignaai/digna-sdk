site_name: Digna Python SDK
site_description: Official Python SDK for Digna, the data-quality and observability platform.
repo_url: ""
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Resources: resources.md
  - Models: models.md
  - Errors: errors.md
  - API Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google
            show_if_no_docstring: true
            extensions:
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
