[project]
name = "digna-sdk"
version = "0.1.0"
description = "A client library for accessing digna-rust"
readme = "README.md"
authors = [
    { name = "Danijel Kivaranovic", email = "danijel.kivaranovic@digna.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://www.digna.ai"
"Repository" = "https://github.com/dignaai/digna-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digna_sdk"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
